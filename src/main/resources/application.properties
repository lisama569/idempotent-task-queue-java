spring.application.name=idempotent-task-queue
# 队列容量（在队未终态任务上限）
idempotent.queue.capacity=1000
# 每秒投递速率限制（令牌桶）
idempotent.queue.rate-limit-per-second=100.0
# 最大消费尝试次数（含首次）
idempotent.queue.max-attempts=3
# 首次失败后的基础退避毫秒数（指数退避）
idempotent.queue.retry-backoff-millis=50
# 投递后多久未 ACK 视为僵死并可重新投递
idempotent.queue.delivery-timeout-millis=5000
# 是否随应用启动消费 worker
idempotent.queue.auto-start-worker=true
