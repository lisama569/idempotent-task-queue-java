# 幂等任务队列默认配置
spring.application.name=idempotent-task-queue

# WAL 日志目录（本地文件，无外部中间件依赖）
idempotent.queue.data-dir=build/queue-data
# 未完成任务容量上限
idempotent.queue.capacity=100
# 每秒投递接受上限（滑动窗口）
idempotent.queue.rate-limit-per-second=20
# 默认最大尝试次数
idempotent.queue.default-max-attempts=3
# 固定重试退避（毫秒）
idempotent.queue.retry-backoff-millis=200
# 消费轮询间隔（毫秒）
idempotent.queue.poll-millis=20
# 随应用启动消费者
idempotent.queue.auto-start-consumer=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
